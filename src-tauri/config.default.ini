; ============================================================
; PlayStunts DX - Configuration
; ============================================================
; This is the single portable configuration file used by the
; Windows desktop build. It lives next to PlayStunts DX.exe.
;
; Original DOS SETUP.DAT remains the authoritative source for
; the original Stunts hardware/display setup. DX-specific and
; desktop settings are stored here.
; ============================================================

[Display]
; Start the main game window in fullscreen mode.
Fullscreen=true

; Start with the PlayStunts DX enhanced renderer enabled.
EnhancedGraphics=true

[Audio]
; off | pc-speaker | tandy | adlib | sound-blaster | mt32
Device=sound-blaster

[Game]
; Current virtual DOS game directory used by the reconstructed game.
Directory=C:\

[Controls]
; Wheel calibration/bindings are stored as compact JSON by the game.
; Leave empty to use no saved wheel calibration.
WheelBindings=

[ForceFeedback]
; Master FFB switch shown in Wheel Setup [F8].
Enabled=false

; Overall output strength shown in Wheel Setup [F8].
; 50 = 1.0x, 100 = 2.0x the base output.
Strength=50

; ============================================================
; Force Feedback tuning
; ============================================================
; Percent values describe the effect's share of full DirectInput force.
; Missing or invalid values fall back to PlayStunts DX defaults.
; Edit this file and use "Reload config.ini" in Wheel Setup [F8].

[General]
; Base multiplier for steering/slide/grass physics. Range 0 - 300 %.
PhysicsStrength=180
; Continuous physics force limit. Range 10 - 100 %.
PhysicsLimit=90
; Absolute final DirectInput force limit. Range 10 - 100 %.
MaxForce=98

[Centering]
; Low-speed self-aligning force at full steering input.
BaseForce=5.5
; Additional self-aligning force as road speed increases.
SpeedForce=24.5

[Slide]
; Counter-steer contribution from signed tyre slip.
SlipForce=34
; Counter-steer contribution from vehicle spin/yaw.
SpinForce=20

[Grass]
; Per-wheel grass/off-road vibration strength.
Strength=13
FrequencyMin=15
FrequencyMax=33

[Landing]
MinFallSpeed=190
MaxFallSpeed=593
MinStrength=28
MaxStrength=90
DurationMs=120

[GearShift]
Strength=15
DurationMs=110

[Engine]
MinStrength=0.8
MaxStrength=2.0
FrequencyMin=3
FrequencyMax=6

[Crash]
MinStrength=72
MaxStrength=100
SpeedForMaxMph=70
ReboundStrength=32
MainDurationMs=150
TotalDurationMs=240

[Menu]
DetentStrength=24
DetentDurationMs=90
RepeatMs=190
