; ============================================================
; PlayStunts DX - Configuration
; ============================================================
; This is the single portable configuration file used by the
; Windows desktop build. It lives next to PlayStunts DX.exe.
;
; Original DOS SETUP.DAT remains the authoritative source for
; the original Stunts hardware/display setup. DX-specific and
; desktop game settings are stored here.
; ============================================================

[Display]
; Start the main game window in fullscreen mode.
Fullscreen=true

; Start with the PlayStunts DX enhanced renderer enabled.
EnhancedGraphics=true

; Enable external High Res / enhanced texture overrides.
EnhancedTextures=true

; Original Stunts graphics detail selection (0 - 2).
OriginalGraphicsLevel=0

; Show the clickable Options [F8] button in the top-right corner.
; The F8 keyboard shortcut remains active when this is false.
ShowOptionsButton=true

[Audio]
; off | pc-speaker | tandy | adlib | sound-blaster | mt32
Device=sound-blaster

; Original in-game music and sound-effect toggles.
Music=true
Effects=true

; Use the project-supplied remixed title/menu/victory/game-over music.
Remix=true

[Game]
; Current virtual DOS game directory used by the reconstructed game.
Directory=C:\

[Gameplay]
; original | enhanced. Original preserves the classic Stunts opponent logic.
OpponentAI=original

[Controls]
; keyboard | joystick | mouse | wheel
InputDevice=keyboard

; Wheel calibration/bindings are stored as compact JSON by the game.
; Leave empty to use no saved wheel calibration.
WheelBindings=

; Inner steering deadzone around the calibrated wheel center, in percent.
; Values outside the deadzone are rescaled so full steering lock remains 100%.
SteeringDeadzone=4

; Keyboard and joystick/wheel-button assignments for the original Stunts
; controls and DX race actions. The F8 Controls editor writes compact JSON here.
; Leave empty to use the defaults, including V for Change View.
ControlBindings=

[Camera]
; Enhanced chase camera position presets used by Change View.
; Distance is behind the car, Height is above it, in renderer world units.
CloseDistance=132
CloseHeight=27
StandardDistance=223
StandardHeight=79
FarDistance=440
FarHeight=150

[ForceFeedback]
; Master FFB switch shown in Wheel Setup [F8].
Enabled=false

; Overall output strength shown in Wheel Setup [F8].
; 50 = 1.0x, 100 = 2.0x the base output.
Strength=50

; ============================================================
; Force Feedback tuning
; ============================================================
; Percent values describe the effect's share of full DirectInput force.
; Missing or invalid values fall back to PlayStunts DX defaults.
; Edit this file and use "Reload config.ini" in Wheel Setup [F8].

[General]
PhysicsStrength=180
PhysicsLimit=90
MaxForce=98

[Centering]
BaseForce=5.5
SpeedForce=24.5

[Slide]
SlipForce=34
SpinForce=20

[Grass]
Strength=13
FrequencyMin=15
FrequencyMax=33

[Ramp]
; Short bump from the real grounded chassis pitch change at a ramp/slope edge.
; Pitch delta uses the game's native rotation units; no track-piece IDs are used.
MinPitchDelta=2
MaxPitchDelta=24
MinStrength=16
MaxStrength=48
DurationMs=90

[Landing]
MinFallSpeed=190
MaxFallSpeed=593
MinStrength=28
MaxStrength=90
DurationMs=120

[GearShift]
Strength=15
DurationMs=110

[Engine]
MinStrength=0.8
MaxStrength=2.0
FrequencyMin=3
FrequencyMax=6

[Crash]
MinStrength=72
MaxStrength=100
SpeedForMaxMph=70
ReboundStrength=32
MainDurationMs=150
TotalDurationMs=240
