name: Bliss source parity check
on:
  push:
    branches: [bliss-editor]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types tools/bliss-route-smoke.ts
      - run: node --experimental-strip-types tools/bliss-scenery-smoke.ts
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public/game | Out-Null
          @('track-materials','track-render-models','terrain-objects','track-objects','collision-planes') | ForEach-Object {
            Set-Content -Path ("public/game/" + $_ + ".json") -Value "{}"
          }
      - run: npm run desktop:web:build
