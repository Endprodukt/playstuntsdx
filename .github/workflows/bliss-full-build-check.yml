name: Bliss full build check
on:
  push:
    branches: [bliss-editor]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run desktop:site-art
      - run: npm run desktop:helper
      - run: npm run desktop:web:build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
