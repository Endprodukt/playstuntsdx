name: Bliss integration check
on:
  push:
    branches: [bliss-editor]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public/game | Out-Null
          @('track-materials','track-render-models','terrain-objects','track-objects','collision-planes') | ForEach-Object {
            Set-Content -Path ("public/game/" + $_ + ".json") -Value "{}"
          }
      - run: npm run desktop:web:build
      - run: cargo check --manifest-path src-tauri/Cargo.toml --features tauri/protocol-asset
