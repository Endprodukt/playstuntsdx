<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080c10" />
    <title>PlayStunts DX</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const tauri = window.__TAURI__?.core;
        const development = location.hostname === '127.0.0.1' && location.port === '1420';
        if (!tauri || development) return;

        const originalFetch = window.fetch.bind(window);
        window.fetch = async (input, init) => {
          const requestUrl = input instanceof Request ? input.url : String(input);
          const url = new URL(requestUrl, location.href);
          if (url.origin === location.origin && url.pathname.startsWith('/game/')) {
            const path = decodeURIComponent(url.pathname.slice('/game/'.length));
            const bytes = await tauri.invoke('read_runtime_file', { path });
            const body = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
            return new Response(body, { status: 200 });
          }
          return originalFetch(input, init);
        };
      })();
    </script>
    <script type="module">
      (async () => {
        const tauri = window.__TAURI__?.core;

        function parseIni(content) {
          const values = new Map();
          let section = '';
          for (const raw of content.replace(/^\uFEFF/, '').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith(';') || line.startsWith('#')) continue;
            const sectionMatch = /^\[([^\]]+)\]$/.exec(line);
            if (sectionMatch) {
              section = sectionMatch[1].trim().toLowerCase();
              continue;
            }
            const equals = line.indexOf('=');
            if (equals < 1) continue;
            const key = line.slice(0, equals).trim().toLowerCase();
            values.set(`${section}.${key}`, line.slice(equals + 1).trim());
          }
          return values;
        }

        const mappings = new Map([
          ['playstunts-dx-sound-device', ['Audio', 'Device']],
          ['playstunts-dx-music-enabled', ['Audio', 'Music']],
          ['playstunts-dx-sound-enabled', ['Audio', 'Effects']],
          ['stunts-native-game-directory', ['Game', 'Directory']],
          ['playstunts-dx-input-device', ['Controls', 'InputDevice']],
          ['playstunts-dx-wheel-bindings-v2', ['Controls', 'WheelBindings']],
          ['playstunts-dx-control-bindings-v1', ['Controls', 'ControlBindings']],
          ['playstunts-dx-force-feedback-enabled', ['ForceFeedback', 'Enabled']],
          ['playstunts-dx-force-feedback-strength', ['ForceFeedback', 'Strength']],
          ['playstunts-dx-enhanced-graphics', ['Display', 'EnhancedGraphics']],
          ['playstunts-dx-enhanced-textures', ['Display', 'EnhancedTextures']],
          ['playstunts-dx-original-graphics-level', ['Display', 'OriginalGraphicsLevel']],
        ]);

        if (tauri) {
          try {
            const file = await tauri.invoke('native_config');
            const values = parseIni(file.content);
            const nativeSetItem = Storage.prototype.setItem;
            const nativeRemoveItem = Storage.prototype.removeItem;
            const writeTimers = new Map();

            const saveConfigValue = (storageKey, value) => {
              const target = mappings.get(String(storageKey));
              if (!target) return;
              const existing = writeTimers.get(storageKey);
              if (existing !== undefined) window.clearTimeout(existing);
              writeTimers.set(storageKey, window.setTimeout(() => {
                writeTimers.delete(storageKey);
                void tauri.invoke('native_config_set', {
                  section: target[0],
                  key: target[1],
                  value: String(value),
                }).catch(reason => console.warn('[Config] Could not save config.ini:', reason));
              }, 60));
            };

            for (const [storageKey, [section, key]] of mappings) {
              const value = values.get(`${section.toLowerCase()}.${key.toLowerCase()}`);
              if (value === undefined || value === '') nativeRemoveItem.call(localStorage, storageKey);
              else nativeSetItem.call(localStorage, storageKey, value);
            }

            Storage.prototype.setItem = function(key, value) {
              nativeSetItem.call(this, key, value);
              if (this === localStorage) saveConfigValue(String(key), String(value));
            };

            Storage.prototype.removeItem = function(key) {
              nativeRemoveItem.call(this, key);
              if (this === localStorage) saveConfigValue(String(key), '');
            };

            const fullscreen = values.get('display.fullscreen')?.toLowerCase();
            const wantsFullscreen = !['0', 'false', 'no', 'off'].includes(fullscreen ?? 'true');
            if (!wantsFullscreen && window.__PLAYSTUNTS_DX_WINDOW__ !== 'mt32') {
              await tauri.invoke('toggle_fullscreen');
            }
          } catch (reason) {
            console.warn('[Config] Could not load config.ini:', reason);
          }
        }

        await import('/main.tsx');
      })();
    </script>
  </body>
</html>
